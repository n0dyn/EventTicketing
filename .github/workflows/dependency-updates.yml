name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 8 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  update-backend-dependencies:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: "1.7.1"
    
    - name: Update backend dependencies
      working-directory: ./backend
      run: |
        poetry update
        poetry show --outdated || true
    
    - name: Run tests after update
      working-directory: ./backend
      run: |
        poetry install
        poetry run pytest --tb=short
    
    - name: Create Pull Request for backend updates
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update backend dependencies"
        title: "chore: Update backend dependencies"
        body: |
          ## Backend Dependency Updates
          
          This PR updates backend dependencies to their latest versions.
          
          ### Changes
          - Updated Python dependencies via Poetry
          - All tests are passing
          
          ### Review Checklist
          - [ ] Review dependency changes
          - [ ] Verify all tests pass
          - [ ] Check for security vulnerabilities
          - [ ] Test critical application flows
          
          Auto-generated by GitHub Actions 🤖
        branch: chore/update-backend-dependencies
        delete-branch: true
        labels: |
          dependencies
          backend
          automated

  update-frontend-dependencies:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "18"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Update frontend dependencies
      working-directory: ./frontend
      run: |
        npm update
        npm outdated || true
        npm audit || true
    
    - name: Run tests after update
      working-directory: ./frontend
      run: |
        npm ci
        npm run test
        npm run build
    
    - name: Create Pull Request for frontend updates
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update frontend dependencies"
        title: "chore: Update frontend dependencies"
        body: |
          ## Frontend Dependency Updates
          
          This PR updates frontend dependencies to their latest versions.
          
          ### Changes
          - Updated Node.js dependencies via npm
          - Build and tests are passing
          
          ### Review Checklist
          - [ ] Review dependency changes
          - [ ] Verify all tests pass
          - [ ] Check for security vulnerabilities
          - [ ] Test critical application flows
          - [ ] Verify build output
          
          Auto-generated by GitHub Actions 🤖
        branch: chore/update-frontend-dependencies
        delete-branch: true
        labels: |
          dependencies
          frontend
          automated

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
    
    - name: Backend security audit
      working-directory: ./backend
      run: |
        pip install safety
        safety check --json || true
    
    - name: Frontend security audit
      working-directory: ./frontend
      run: |
        npm install
        npm audit --audit-level=moderate || true
    
    - name: Create security issue if vulnerabilities found
      if: failure()
      uses: JasonEtco/create-an-issue@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        filename: .github/ISSUE_TEMPLATE/security-vulnerability.md
        update_existing: true